name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  verificar:
    name: Tipos, testes, build e auditoria
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # Monorepo (npm workspaces): um único package-lock.json na raiz
      - run: npm ci
      - name: Gerar o cliente do Prisma
        run: npx prisma generate
        working-directory: backend
      - name: Backend — TypeScript
        run: npx tsc --noEmit
        working-directory: backend
      - name: Frontend — TypeScript + build
        run: npm run build
        working-directory: frontend
      - name: Backend — testes (API, recorrência, produção)
        run: npm test
        working-directory: backend
      - name: Vulnerabilidades em dependências de produção
        run: npm audit --omit=dev --audit-level=high
